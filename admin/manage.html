<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-brand-title="{brand} Admin">Fitness Agency Admin</title>
    <link rel="icon" href="/assets/images/favicon/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon/favicon-32x32.png" data-brand-favicon>
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/assets/images/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/assets/images/favicon/site.webmanifest">
    <meta name="theme-color" content="#fafaf9">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/admin.css?v=20260729">
    <link rel="stylesheet" href="/assets/css/builder.css?v=20260730">
</head>

<body class="admin-body">
    <div class="admin-shell">
        <aside class="admin-sidebar" id="adminSidebar"></aside>
        <div class="admin-sidebar-overlay" id="adminSidebarOverlay"></div>
        <div class="admin-main">
            <header class="admin-topbar" id="adminTopbar"></header>
            <main class="admin-content" id="panelHost"></main>
        </div>
    </div>

    <!-- ============================================================
         Panel templates — one per section. Each holds exactly what
         used to be that section's <main class="admin-content"> inner
         content. Inert until router.js clones one into #panelHost on
         first visit; never fetched over the network.
         ============================================================ -->

    <template id="tpl-dashboard">
        <h1 class="admin-page-title">Dashboard</h1>
        <p class="admin-page-subtitle">A high-level view of the business, updated in real time.</p>

        <div class="dev-panel u-hidden" id="devPanel">
            <h6><i class="fa-solid fa-flask"></i> Development tools</h6>
            <p>Only visible in development mode — disabled entirely in production.</p>
            <div class="dev-panel__actions">
                <button class="a-btn a-btn-secondary" id="devCreateCustomerBtn"><i class="fa-solid fa-user-plus"></i> Create Test Customer</button>
                <button class="a-btn a-btn-secondary" id="devSimulatePurchaseBtn"><i class="fa-solid fa-cart-plus"></i> Simulate Purchase</button>
                <button class="a-btn a-btn-secondary" id="devSeedBtn"><i class="fa-solid fa-database"></i> Seed Demo Data</button>
            </div>
        </div>

        <!-- Outbound email health. Sits above the metrics because a silent
             mail outage means customers cannot sign in and buyers get no
             receipt — it outranks any revenue figure below it. Hidden until
             the overview reports a problem. -->
        <div class="a-alert a-alert--danger u-hidden" id="emailHealthAlert" role="alert"></div>

        <div class="metric-grid" id="metricGrid"></div>

        <div class="a-card a-card-pad" id="promotionsWidget">
            <h6 class="u-mb-12"><i class="fa-solid fa-tag"></i> Promotions</h6>
            <div class="metric-grid metric-grid-compact" id="promotionsWidgetGrid"></div>
        </div>

        <div class="chart-grid">
            <div class="a-card chart-card">
                <h6>Revenue over time (30 days)</h6>
                <div class="a-skeleton u-h-260" id="revenueChartSkeleton"></div>
                <canvas id="revenueChart" class="u-hidden"></canvas>
            </div>
            <div class="a-card chart-card">
                <h6>Payment method distribution</h6>
                <div class="a-skeleton u-h-260" id="paymentMethodChartSkeleton"></div>
                <canvas id="paymentMethodChart" class="u-hidden"></canvas>
            </div>
        </div>

        <div class="chart-grid-2">
            <div class="a-card chart-card">
                <h6>Orders over time</h6>
                <div class="a-skeleton u-h-260" id="ordersChartSkeleton"></div>
                <canvas id="ordersChart" class="u-hidden"></canvas>
            </div>
            <div class="a-card chart-card">
                <h6>New users over time</h6>
                <div class="a-skeleton u-h-260" id="newUsersChartSkeleton"></div>
                <canvas id="newUsersChart" class="u-hidden"></canvas>
            </div>
        </div>

        <div class="chart-grid-2">
            <div class="a-card chart-card">
                <h6>Top-selling products</h6>
                <div class="a-skeleton u-h-260" id="topProductsChartSkeleton"></div>
                <canvas id="topProductsChart" class="u-hidden"></canvas>
            </div>
            <div class="a-card a-card-pad">
                <h6 class="u-mb-12">Recent activity</h6>
                <div id="activityFeed"></div>
            </div>
        </div>
    </template>

    <template id="tpl-orders">
        <h1 class="admin-page-title">Orders</h1>
        <p class="admin-page-subtitle">Every order placed on the platform.</p>

        <div class="a-card">
            <div class="a-card-pad u-pb-0">
                <div class="a-toolbar">
                    <input type="text" id="orderSearch" placeholder="Search order ID, name, or email…" class="u-minw-260">
                    <select id="statusFilter">
                        <option value="">All payment statuses</option>
                        <option value="paid">Paid</option>
                        <option value="pending">Pending</option>
                        <option value="failed">Failed</option>
                        <option value="refunded">Refunded</option>
                    </select>
                    <select id="providerFilter">
                        <option value="">All providers</option>
                        <option value="stripe">Stripe</option>
                        <option value="paypal">PayPal</option>
                        <option value="dev">Dev</option>
                    </select>
                    <select id="sortFilter">
                        <option value="createdAt-desc">Newest first</option>
                        <option value="createdAt-asc">Oldest first</option>
                        <option value="totalCents-desc">Amount: high to low</option>
                        <option value="totalCents-asc">Amount: low to high</option>
                    </select>
                </div>
            </div>
            <div class="a-table-wrap">
                <table class="a-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Email</th>
                            <th>Product(s)</th>
                            <th>Amount</th>
                            <th>Provider</th>
                            <th>Payment</th>
                            <th>Delivery</th>
                            <th>Date</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody"></tbody>
                </table>
            </div>
            <div class="a-pagination" id="ordersPagination"></div>
        </div>
    </template>

    <template id="tpl-products">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
                <h1 class="admin-page-title">Products</h1>
                <p class="admin-page-subtitle">Manage the plans and guides sold on the storefront.</p>
            </div>
            <button class="a-btn a-btn-primary a-btn-sm u-w-auto" id="createProductBtn"><i class="fa-solid fa-plus"></i> New Product</button>
        </div>

        <div class="a-card">
            <div class="a-card-pad u-pb-0">
                <div class="a-toolbar">
                    <input type="text" id="productSearch" placeholder="Search by name, creator or ID…" class="u-minw-240">
                    <select id="statusFilter">
                        <option value="">All statuses</option>
                        <option value="published">Published</option>
                        <option value="draft">Draft</option>
                        <option value="private">Private (unlisted)</option>
                        <option value="scheduled">Scheduled</option>
                        <option value="archived">Archived</option>
                        <!-- Showcase-only products, used by private presentation
                             decks and deliberately invisible to the storefront. -->
                        <option value="presentation">Presentation products</option>
                    </select>
                </div>
            </div>
            <div class="a-table-wrap">
                <table class="a-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Navigation</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Featured</th>
                            <th>Created</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody"></tbody>
                </table>
            </div>
            <!-- Rendered by assets/js/admin/products.js. Hidden entirely while
                 the whole result set fits on one page, so a small catalogue
                 never grows controls it has no use for. -->
            <div class="a-pager u-hidden" id="productsPager">
                <span class="a-pager__count" id="productsPagerCount"></span>
                <div class="a-pager__controls">
                    <label class="a-pager__size">
                        Per page
                        <select id="productsPageSize">
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </label>
                    <button class="a-btn a-btn-secondary a-btn-sm" id="productsPrev" type="button">
                        <i class="fa-solid fa-chevron-left"></i> Prev
                    </button>
                    <span class="a-pager__page" id="productsPagerPage"></span>
                    <button class="a-btn a-btn-secondary a-btn-sm" id="productsNext" type="button">
                        Next <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-navigation">
        <h1 class="admin-page-title">Navigation</h1>
        <p class="admin-page-subtitle">Manage the Shop by Goal, Browse Athletes, and Browse Creators trees — changes here update storefront navigation and filters everywhere automatically, no code changes needed.</p>

        <div id="taxonomyList"></div>
    </template>

    <template id="tpl-presentations">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
                <h1 class="admin-page-title">Private Presentations</h1>
                <p class="admin-page-subtitle">Unlisted, link-only decks for investor, partner and athlete meetings. These never appear anywhere on the public site.</p>
            </div>
            <button class="a-btn a-btn-primary a-btn-sm u-w-auto" id="createPresentationBtn"><i class="fa-solid fa-plus"></i> New Presentation</button>
        </div>

        <div class="a-card">
            <div class="a-card-pad u-pb-0">
                <div class="a-toolbar">
                    <input type="text" id="presentationSearch" placeholder="Search title or recipient…" class="u-minw-260">
                    <select id="presentationStatusFilter">
                        <option value="">All statuses</option>
                        <option value="enabled">Enabled</option>
                        <option value="disabled">Disabled</option>
                    </select>
                    <select id="presentationSortFilter">
                        <option value="createdAt-desc">Newest first</option>
                        <option value="createdAt-asc">Oldest first</option>
                        <option value="updatedAt-desc">Recently updated</option>
                        <option value="title-asc">Title A–Z</option>
                    </select>
                </div>
            </div>
            <div class="a-table-wrap">
                <table class="a-table">
                    <thead>
                        <tr>
                            <th>Presentation</th>
                            <th>Status</th>
                            <th>Access</th>
                            <th>Expires</th>
                            <th>Visits</th>
                            <th>Enquiries</th>
                            <th>Created</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="presentationsTableBody"></tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="tpl-promotions">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
                <h1 class="admin-page-title">Promotions</h1>
                <p class="admin-page-subtitle">Discount codes, influencer/affiliate codes, and campaign promotions.</p>
            </div>
            <button class="a-btn a-btn-primary a-btn-sm u-w-auto" id="createPromotionBtn"><i class="fa-solid fa-plus"></i> New Promotion</button>
        </div>

        <div class="a-card">
            <div class="a-card-pad u-pb-0">
                <div class="a-toolbar">
                    <input type="text" id="promotionSearch" placeholder="Search name or code…" class="u-minw-260">
                    <select id="promotionStatusFilter">
                        <option value="">All statuses</option>
                        <option value="enabled">Enabled</option>
                        <option value="paused">Paused</option>
                        <option value="disabled">Disabled</option>
                    </select>
                    <select id="promotionKindFilter">
                        <option value="">All code kinds</option>
                        <option value="STANDARD">Standard</option>
                        <option value="AFFILIATE">Affiliate</option>
                        <option value="INFLUENCER">Influencer</option>
                        <option value="CAMPAIGN">Campaign</option>
                    </select>
                </div>
            </div>
            <div class="a-table-wrap">
                <table class="a-table">
                    <thead>
                        <tr>
                            <th>Promotion</th>
                            <th>Status</th>
                            <th>Discount</th>
                            <th>Creator / Campaign</th>
                            <th>Uses</th>
                            <th>Revenue</th>
                            <th>Expiration</th>
                            <th>Created By</th>
                            <th>Last Used</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="promotionsTableBody"></tbody>
                </table>
            </div>
            <div class="a-pagination" id="promotionsPagination"></div>
        </div>
    </template>

    <template id="tpl-customers">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
                <h1 class="admin-page-title">Customers</h1>
                <p class="admin-page-subtitle">Everyone who has an account on the storefront.</p>
            </div>
            <button class="a-btn a-btn-primary a-btn-sm u-w-auto" id="createCustomerBtn"><i class="fa-solid fa-user-plus"></i> New Customer</button>
        </div>

        <div class="a-card">
            <div class="a-card-pad u-pb-0">
                <div class="a-toolbar">
                    <input type="text" id="customerSearch" placeholder="Search by name or email…" class="u-minw-260">
                </div>
            </div>
            <div class="a-table-wrap">
                <table class="a-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Registered</th>
                            <th>Lifetime Spend</th>
                            <th>Orders</th>
                            <th>Last Login</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="customersTableBody"></tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="tpl-analytics">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
                <h1 class="admin-page-title">Analytics</h1>
                <p class="admin-page-subtitle">Revenue, orders, and customer trends over time.</p>
            </div>
            <select id="rangeSelect" class="a-pill-btn">
                <option value="7d">Last 7 days</option>
                <option value="30d" selected>Last 30 days</option>
                <option value="90d">Last 90 days</option>
                <option value="1y">Last 1 year</option>
                <option value="lifetime">Lifetime</option>
            </select>
        </div>

        <div class="metric-grid" id="metricGrid"></div>

        <div class="chart-grid">
            <div class="a-card chart-card">
                <h6 id="salesChartTitle">Sales over time</h6>
                <div class="a-skeleton u-h-260" id="salesChartSkeleton"></div>
                <canvas id="salesChart" class="u-hidden"></canvas>
            </div>
            <div class="a-card a-card-pad">
                <h6 class="u-mb-12">Best-selling products</h6>
                <div class="a-table-wrap">
                    <table class="a-table">
                        <thead><tr><th>Product</th><th>Units</th><th>Revenue</th></tr></thead>
                        <tbody id="productsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-email-logs">
        <h1 class="admin-page-title">Email Logs</h1>
        <p class="admin-page-subtitle">Every outgoing email the platform has sent.</p>

        <div class="a-card">
            <div class="a-card-pad u-pb-0">
                <div class="a-toolbar">
                    <input type="text" id="logSearch" placeholder="Search recipient or subject…" class="u-minw-260">
                    <select id="statusFilter">
                        <option value="">All statuses</option>
                        <option value="sent">Sent</option>
                        <option value="failed">Failed</option>
                    </select>
                </div>
            </div>
            <div class="a-table-wrap">
                <table class="a-table">
                    <thead>
                        <tr>
                            <th>Recipient</th>
                            <th>Subject</th>
                            <th>Status</th>
                            <th>Opened</th>
                            <th>Sent</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody"></tbody>
                </table>
            </div>
            <div class="a-pagination" id="logsPagination"></div>
        </div>
    </template>

    <template id="tpl-payment-logs">
        <h1 class="admin-page-title">Payment Logs</h1>
        <p class="admin-page-subtitle">Every payment event received from Stripe and PayPal.</p>

        <div class="a-card">
            <div class="a-card-pad u-pb-0">
                <div class="a-toolbar">
                    <input type="text" id="logSearch" placeholder="Search email, order/event ref…" class="u-minw-260">
                    <select id="providerFilter">
                        <option value="">All providers</option>
                        <option value="stripe">Stripe</option>
                        <option value="paypal">PayPal</option>
                    </select>
                    <select id="statusFilter">
                        <option value="">All statuses</option>
                        <option value="succeeded">Succeeded</option>
                        <option value="failed">Failed</option>
                    </select>
                </div>
            </div>
            <div class="a-table-wrap">
                <table class="a-table">
                    <thead>
                        <tr>
                            <th>Webhook Event</th>
                            <th>Provider</th>
                            <th>Status</th>
                            <th>Customer</th>
                            <th>Order</th>
                            <th>Timestamp</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody"></tbody>
                </table>
            </div>
            <div class="a-pagination" id="logsPagination"></div>
        </div>
    </template>

    <template id="tpl-system-logs">
        <h1 class="admin-page-title">System Logs</h1>
        <p class="admin-page-subtitle">Logins, order/product/user events, and admin actions across the platform.</p>

        <div class="a-card">
            <div class="a-card-pad u-pb-0">
                <div class="a-toolbar">
                    <input type="text" id="logSearch" placeholder="Search message…" class="u-minw-260">
                    <select id="categoryFilter">
                        <option value="">All categories</option>
                    </select>
                </div>
            </div>
            <div class="a-table-wrap">
                <table class="a-table">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Message</th>
                            <th>Actor</th>
                            <th>Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody"></tbody>
                </table>
            </div>
            <div class="a-pagination" id="logsPagination"></div>
        </div>
    </template>

    <template id="tpl-settings">
        <h1 class="admin-page-title">Settings</h1>
        <p class="admin-page-subtitle">Store configuration. Technical/infrastructure settings are managed by developers through the deployment environment, not here.</p>

        <div class="a-card a-card-pad u-max-640">
            <h6 class="u-mb-16">Store</h6>
            <form id="settingsForm">
                <div class="a-form-row">
                    <label>Store Name</label>
                    <input type="text" name="storeName" id="storeName">
                </div>
                <div class="a-form-grid">
                    <div class="a-form-row">
                        <label>Currency</label>
                        <select name="currency" id="currency">
                            <option value="USD">USD ($)</option>
                            <option value="EUR">EUR (€)</option>
                            <option value="GBP">GBP (£)</option>
                        </select>
                    </div>
                    <div class="a-form-row">
                        <label>Tax Rate (%)</label>
                        <input type="number" name="taxRate" id="taxRate" min="0" max="100" step="0.01">
                    </div>
                </div>
                <div class="a-form-row">
                    <label>Email "From" Name</label>
                    <input type="text" name="emailFromName" id="emailFromName">
                </div>
                <button type="submit" class="a-btn a-btn-primary u-w-auto">Save Changes</button>
            </form>
        </div>

        <div class="a-card a-card-pad u-max-640">
            <h6 class="u-mb-16">Logo</h6>
            <div class="u-flex-gap-20-wrap">
                <img id="logoPreview" src="" alt="" class="u-logo-preview">
                <form id="logoForm" class="u-flex-gap-10">
                    <input type="file" name="logo" accept="image/*" required>
                    <button type="submit" class="a-btn a-btn-secondary a-btn-sm">Upload</button>
                </form>
            </div>
        </div>

    </template>

    <script src="/assets/js/admin/api.js"></script>
    <!-- Must load before anything that uploads: the builder dialogs and the
         settings panel both call AdminUpload.maybeCompressImage on pick. -->
    <script src="/assets/js/admin/upload-compress.js"></script>
    <script src="/assets/js/admin/ui.js"></script>
    <script src="/assets/js/admin/wizard-shell.js"></script>
    <script src="/assets/js/admin/dashboard.js"></script>
    <script src="/assets/js/admin/orders.js"></script>
    <script src="/assets/js/admin/products.js"></script>
    <!-- Product Builder. core.js is the DOM-free engine and must load before
         the two view layers, which both call into it at definition time. -->
    <script src="/assets/js/admin/builder/core.js"></script>
    <script src="/assets/js/admin/builder/dialogs.js"></script>
    <script src="/assets/js/admin/builder/ui.js"></script>
    <script src="/assets/js/admin/navigation.js"></script>
    <script src="/assets/js/admin/customers.js"></script>
    <script src="/assets/js/admin/promotion-wizard.js"></script>
    <script src="/assets/js/admin/promotions.js"></script>
    <script src="/assets/js/admin/promotion-drawer.js"></script>
    <script src="/assets/js/admin/presentations.js"></script>
    <script src="/assets/js/admin/notifications.js"></script>
    <script src="/assets/js/admin/analytics.js"></script>
    <script src="/assets/js/admin/email-logs.js"></script>
    <script src="/assets/js/admin/payment-logs.js"></script>
    <script src="/assets/js/admin/system-logs.js"></script>
    <script src="/assets/js/admin/settings.js"></script>
    <script src="/assets/js/admin/layout.js"></script>
    <script src="/assets/js/admin/router.js"></script>
    <script src="/assets/js/branding.js"></script>
</body>

</html>
